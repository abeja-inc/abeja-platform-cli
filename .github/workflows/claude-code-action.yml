# DEBUG: change to debug PR review for New PR.
name: PR review with Claude Code Action

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.CLAUDE_VERTEX_AI_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.CLAUDE_VERTEX_AI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CLAUDE_VERTEX_AI_GCP_SERVICE_ACCOUNT }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          CLOUD_ML_REGION: us-east5
          CLAUDE_CODE_ENDPOINT: vertex
          ANTHROPIC_VERTEX_ENABLE_PROMPT_CACHING: true
        with:
          use_vertex: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 5
            --allowedTools "Bash(gh pr edit *),Bash(gh pr view *)"
            --system-prompt "PRのコードレビューを行ってください。回答は常に日本語で行ってください。"
